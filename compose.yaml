services:
  api:
    build:
      context: .
      target: api
    env_file:
      - apps/api/.env
    environment:
      PORT: "3003"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"

  game:
    build:
      context: .
      target: game
    environment:
      PORT: "3002"
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "3002:3002"

  site:
    build:
      context: .
      target: site
    environment:
      PORT: "3001"
    restart: unless-stopped
    ports:
      - "3001:3001"
